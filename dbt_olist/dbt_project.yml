name: 'dbt_olist'
version: '1.0.0'
config-version: 2

profile: 'olist'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Model configurations
models:
  dbt_olist:
    # Staging: Views (free storage)
    staging:
      +materialized: view
      +schema: staging
    
    # Marts: Tables with optimizations
    marts:
      +materialized: table
      +schema: gold
